name: Ubuntu
on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical
      TZ: Asia/Shanghai
      
    steps:     
      - name: 更改系统语言(中文)
        run: |
          sudo -i <<EOF
          apt update -y
          apt install -y locales language-pack-zh-hans language-pack-zh-hans-base
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8
          EOF
          
      - name: 关闭防火墙
        run: |
          sudo -i <<EOF
          ufw disable
          EOF

      - name: 安装Tailscale和VS Code网页版
        run: |
          sudo -i <<EOF
          curl -fsSL https://tailscale.com/install.sh | sh
          curl -fsSL https://code-server.dev/install.sh | sh

      - name: 连接Tailscale内网
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          sudo tailscale up --authkey "$KEY" --hostname "github-${{ github.run_id }}"
          TAILSCALE_IP=""
          RETRIES=0
          while [ -z "$TAILSCALE_IP" ] && [ $RETRIES -lt 10 ]; do
            TAILSCALE_IP=$(sudo tailscale ip -4)
            sleep 3
            RETRIES=$((RETRIES + 1))
          done
          if [ -z "$TAILSCALE_IP" ]; then
            echo "Error: Failed to get Tailscale IPv4 address."
            exit 1
          fi
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> $GITHUB_ENV

      - name: 配置VS Code网页版
        run: |
          pkill -f code-server 2>/dev/null || true
          sudo systemctl stop code-server@* 2>/dev/null || true
          sudo systemctl disable code-server@* 2>/dev/null || true
          code-server --bind-addr 127.0.0.1:8080 &
          PROC_ID=$!
          sleep 10
          kill $PROC_ID
          wait $PROC_ID 2>/dev/null || true
          sed -i 's/bind-addr: 127.0.0.1:8080/bind-addr: 0.0.0.0:8080/' ~/.config/code-server/config.yaml
          PASSWORD=$(grep 'password:' ~/.config/code-server/config.yaml | awk '{print $2}')
          RETRIES=0
          while [ -z "$PASSWORD" ] && [ $RETRIES -lt 5 ]; do
            sleep 2
            PASSWORD=$(grep 'password:' ~/.config/code-server/config.yaml | awk '{print $2}')
            RETRIES=$((RETRIES + 1))
          done
          if [ -z "$PASSWORD" ]; then
            echo "Error: 读取code-server登录密码失败!"
            exit 1
          fi
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
          sudo chown -R runner:runner /home/runner/.config/code-server
          sudo systemctl enable --now code-server@runner
          sleep 3
          systemctl status code-server@runner

      - name: 展示信息
        run: |
          PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me)
          echo "PUBLIC_IP=${PUBLIC_IP}" >> $GITHUB_ENV
          echo "======================================"
          echo "虚拟机公网出口IP: ${{ env.PUBLIC_IP }}"
          echo "Tailscale内网IP: ${{ env.TAILSCALE_IP }}"
          echo "VS Code网页地址: http://${{ env.TAILSCALE_IP }}:8080"
          echo "VS Code登录密码: ${{ env.PASSWORD }}"
          echo "======================================"
      
      - name: 持续保活
        run: |
          while true; do
            echo "Ubuntu服务器运行中"
            sleep 300
          done