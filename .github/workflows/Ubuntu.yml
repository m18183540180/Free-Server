name: Ubuntu
on:
  workflow_dispatch:

jobs:
  secure-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 3600
    env:
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical
      TZ: Asia/Shanghai
      
    steps:
      - name: 更新系统
        run: |
          sudo -i <<EOF
          apt upgrade
          apt update -y
          
      - name: 更改系统语言(中文)
        run: |
          sudo -i <<EOF
          apt update -y
          apt install -y locales language-pack-zh-hans language-pack-zh-hans-base
          locale-gen zh_CN.UTF-8
          update-locale LANG=zh_CN.UTF-8 LC_ALL=zh_CN.UTF-8
          EOF
          
      - name: 关闭防火墙
        run: |
          sudo -i <<EOF
          ufw disable
          EOF

      - name: 安装cloudflared + VS Code网页版
        run: |
          sudo -i <<EOF
          mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' | tee /etc/apt/sources.list.d/cloudflared.list
          apt update -y
          apt install -y cloudflared
          curl -fsSL https://code-server.dev/install.sh | sh
          EOF

      - name: 连接Cloudflared隧道
        env:
          UBUNTU_KEY: ${{ secrets.Ubuntu_KEY }}
        run: |
          sudo cloudflared service install "${{ secrets.Ubuntu_KEY }}"

      - name: 配置VS Code网页版
        run: |
          pkill -f code-server 2>/dev/null || true
          sudo systemctl stop code-server@* 2>/dev/null || true
          sudo systemctl disable code-server@* 2>/dev/null || true
          pkill -f code-server 2>/dev/null || true
          sudo systemctl stop code-server@root 2>/dev/null || true
          sudo systemctl disable code-server@root 2>/dev/null || true
          sudo systemctl start code-server@root
          sleep 5
          sudo systemctl status code-server@root
          sudo sed -i 's/bind-addr: 127.0.0.1:8080/bind-addr: 0.0.0.0:8080/' /root/.config/code-server/config.yaml
          sudo sed -i 's/auth: password/auth: none/' /root/.config/code-server/config.yaml
          sudo systemctl restart code-server@root
          sudo systemctl enable code-server@root
          sleep 3
          systemctl status code-server@root

      - name: 展示信息
        run: |
          PUBLIC_IP=$(curl -s --max-time 10 ifconfig.me)
          echo "PUBLIC_IP=${PUBLIC_IP}" >> $GITHUB_ENV
          echo "虚拟机公网IP: ${PUBLIC_IP}"
      
      - name: 持续保活
        run: |
          while true; do
            echo "Ubuntu服务器运行中"
            sleep 300
          done
