name: Windows
on:
  workflow_dispatch

jobs:
  secure_rdp_deploy:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 配置RDP基础参数
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-CF"
          netsh advfirewall firewall add rule name="RDP-CF" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: 创建windows登录账户
        run: |
          $RDP_USER = "Administrator"
          $RDP_PASS = "@Awf123456789"
          $securePass = ConvertTo-SecureString $RDP_PASS -AsPlainText -Force

          New-LocalUser -Name $RDP_USER `
            -Password $securePass `
            -FullName $RDP_USER `
            -Description "Remote Desktop Administrator Account"

          Add-LocalGroupMember -Group "Administrators" -Member $RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $RDP_USER

          echo "RDP_USER=$RDP_USER" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$RDP_PASS" >> $env:GITHUB_ENV

      - name: 安装cloudflared
        run: |
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.msi"
          $installerPath = "$env:TEMP\cloudflared.msi"
          
          Invoke-WebRequest -Uri $cfUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: 连接Cloudflare隧道
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          & "$env:ProgramFiles\Cloudflare\cloudflared\cloudflared.exe" service install "$env:KEY"

      - name: 展示信息
        run: |
          Write-Host "用户名：$env:RDP_USER"
          Write-Host "密码：$env:RDP_PASSWORD"
          
      - name: 持续保活
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Windows服务器运行中"
            Start-Sleep -Seconds 300
          }