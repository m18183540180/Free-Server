name: Windows
on:
  workflow_dispatch

jobs:
  secure_rdp_deploy:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 配置RDP基础参数
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-CF"
          netsh advfirewall firewall add rule name="RDP-CF" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: 创建windows登录账户
        run: |
          $RDP_USER = "Administrator"
          $RDP_PASS = "@Awf123456789"
          $securePass = ConvertTo-SecureString $RDP_PASS -AsPlainText -Force

          New-LocalUser -Name $RDP_USER `
            -Password $securePass `
            -FullName $RDP_USER `
            -Description "Remote Desktop Administrator Account"

          Add-LocalGroupMember -Group "Administrators" -Member $RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $RDP_USER

          echo "RDP_USER=$RDP_USER" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$RDP_PASS" >> $env:GITHUB_ENV

      - name: 安装并连接Tailscale VPN
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:KEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "TS_IP=$ts_ip" >> $env:GITHUB_ENV

      - name: 展示信息
        run: |
          Write-Host "Tailscale IP:$env:TS_IP" -ForegroundColor Yellow
          Write-Host "用户名: $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "密码: $env:RDP_PASSWORD" -ForegroundColor Yellow
          
      - name: 持续保活
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Windows服务器运行中"
            Start-Sleep -Seconds 300
          }