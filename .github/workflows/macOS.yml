name: macOS
on: workflow_dispatch

jobs:
  macos-gui:
    runs-on: macos-latest
    timeout-minutes: 3600
    steps:
      - name: 安装Tailscale + TigerVNC
        run: brew install tailscale

      - name: 启动 Tailscale 后台守护进程
        run: |
          sudo brew services start tailscale
          sleep 8

      - name: Tailscale 入网
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          sudo tailscale up --authkey=${KEY}

      - name: IP
        run: tailscale ip

      - name: 保持运行
        run: sleep 360
