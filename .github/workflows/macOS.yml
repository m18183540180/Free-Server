name: macOS
on: workflow_dispatch

jobs:
  macos-gui:
    runs-on: macos-latest
    timeout-minutes: 3600
    steps:
      - name: 安装Cloudflared
        run: brew install cloudflared

      - name: 连接Cloudflare隧道
        env:
          macOS_KEY: ${{ secrets.macOS_KEY }}
        run: |
          sudo cloudflared service install "${macOS_KEY}"

      - name: 展示信息
        run: |

      - name: 持续保活
        run: |
          while true; do
            echo "[$(date)] macOS服务器运行中"
            sleep 300
          done